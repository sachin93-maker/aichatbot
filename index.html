<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        
        <div class="ai-chat-box">
            <img src="ai.png" alt="" id="aiImage" width="10%" > 
            <div class="ai-chat-area">
               hello! how can i help you today?
            </div>
           
        </div>
    </div>
    <div class="prompt-area">
        <input type="text" id="prompt" placeholder="ask anything..">
        <button id="image"><img src="image.svg" alt=""><input type="file" accept="images/*" hidden></button>
        
        <button id="submit"><img src="submit.svg" alt=""></button>
    </div>
    <script src="script.js"></script>
</body>
</html>
